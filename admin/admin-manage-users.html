<style>

/* =========================
   ACTIVATE / DEACTIVATE
========================= */

.switch {

  position: relative;

  display: inline-block;

  width: 50px;

  height: 24px;

}

.switch input {

  opacity: 0;

  width: 0;

  height: 0;

}

.slider {

  position: absolute;

  cursor: pointer;

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  background: #ccc;

  transition: .4s;

  border-radius: 24px;

}

.slider:before {

  position: absolute;

  content: "";

  height: 18px;
  width: 18px;

  left: 3px;
  bottom: 3px;

  background: white;

  transition: .4s;

  border-radius: 50%;

}

.switch input:checked + .slider {

  background: #4da6b3;

}

.switch input:checked + .slider:before {

  transform: translateX(26px);

}


/* =========================
   LOGOUT CONFIRMATION
========================= */

.logout-overlay {

  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, 0.35);

  display: none;

  align-items: center;

  justify-content: center;

  z-index: 9999;

  padding: 20px;

}

.logout-overlay.show {

  display: flex;

}

.logout-modal {

  width: 100%;

  max-width: 380px;

  background: white;

  border-radius: 18px;

  padding: 28px;

  text-align: center;

  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.20);

  animation: logoutModalIn 0.20s ease;

}

.logout-modal h2 {

  margin: 0 0 10px;

  color: #3036a8;

  font-size: 24px;

}

.logout-modal p {

  margin: 0 0 25px;

  color: #666;

  font-size: 15px;

}

.logout-actions {

  display: flex;

  justify-content: center;

  gap: 12px;

}

.logout-actions button {

  border: none;

  padding: 11px 22px;

  border-radius: 10px;

  cursor: pointer;

  font-weight: 600;

  font-size: 14px;

}

.logout-cancel-btn {

  background: #e9e9e9;

  color: #444;

}

.logout-cancel-btn:hover {

  background: #dcdcdc;

}

.logout-confirm-btn {

  background: #ff4fa3;

  color: white;

}

.logout-confirm-btn:hover {

  background: #ed3f93;

}

@keyframes logoutModalIn {

  from {

    opacity: 0;

    transform: scale(0.95);

  }

  to {

    opacity: 1;

    transform: scale(1);

  }

}


/* =========================
   USER TABLE
========================= */

.grades-table {

  width: 100%;

  overflow-x: auto;

}

.grades-table table {

  width: 100%;

  min-width: 900px;

  border-collapse: collapse;

}

.grades-table th,
.grades-table td {

  text-align: center;

  padding: 14px 10px;

}

.grades-table th {

  white-space: nowrap;

}

.grades-table td {

  vertical-align: middle;

}


/* =========================
   ASSIGNMENT DROPDOWNS
========================= */

.user-assignment-select {

  min-width: 150px;

  padding: 8px 10px;

  border: 1px solid #d4d4d4;

  border-radius: 8px;

  background: white;

  font-size: 14px;

  cursor: pointer;

}

.user-assignment-select:focus {

  outline: none;

  border-color: #4da6b3;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

  .logout-modal {

    max-width: 340px;

    padding: 24px;

  }

  .logout-actions {

    flex-direction: column;

  }

  .logout-actions button {

    width: 100%;

  }

}

</style>
