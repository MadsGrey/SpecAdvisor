<!DOCTYPE html>
<html>

<head>

<title>
Admin Monitoring
</title>

<link
  rel="icon"
  type="image/png"
  href="../images/SpecAdvisor-logofavicon.png?v=2"
>

<link
  rel="stylesheet"
  href="../css/styles.css"
>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

</head>


<body>

<div class="dashboard">


<!-- =========================================================
     SIDEBAR
========================================================= -->

<div class="sidebar" id="sidebar">

  <div class="sidebar-logo">

    <img src="../images/SpecAdvisor-Logo.png">

  </div>


  <button
    class="sidebar-item"
    onclick="goPage('../admin/admin-dashboard.html')"
  >

    <span class="sidebar-icon">

      <svg viewBox="0 0 24 24">

        <path d="M3 11.5L12 4l9 7.5"></path>

        <path d="M5 10v10h14V10"></path>

        <path d="M9 20v-6h6v6"></path>

      </svg>

    </span>

    <span>
      Dashboard
    </span>

  </button>


  <button
    class="sidebar-item"
    onclick="goPage('../admin/admin-manage-users.html')"
  >

    <span class="sidebar-icon">

      <svg viewBox="0 0 24 24">

        <circle
          cx="9"
          cy="8"
          r="3"
        ></circle>

        <path
          d="M3 20c0-3.3 2.7-6 6-6s6 3 6 6"
        ></path>

        <path
          d="M16 11c2.2 0 4 1.8 4 4"
        ></path>

        <path
          d="M17 5.5a3 3 0 0 1 0 5"
        ></path>

      </svg>

    </span>

    <span>
      Manage Users
    </span>

  </button>

  

        <!-- ADMINISTER EXAMS -->

        <button
            class="sidebar-item"
            onclick="goPage('../admin/administer-exam.html')"
        >

            <span class="sidebar-icon">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="3"
                        width="16"
                        height="18"
                        rx="2"
                    ></rect>

                    <path d="M8 7h8"></path>

                    <path d="M8 11h8"></path>

                    <path d="M8 15h5"></path>

                    <path d="M16 17l2 2 4-4"></path>

                </svg>

            </span>

            <span>
                Administer Exams
            </span>

        </button>



  <button
    class="sidebar-item active"
  >

    <span class="sidebar-icon">

      <svg viewBox="0 0 24 24">

        <path
          d="M3 12h4l2-7 4 14 2-7h6"
        ></path>

      </svg>

    </span>

    <span>
      Monitoring Activities
    </span>

  </button>


  <button
    class="sidebar-item"
    onclick="goPage('../admin/academic-management.html')"
  >

    <span class="sidebar-icon">

      <svg viewBox="0 0 24 24">

        <rect
          x="4"
          y="4"
          width="16"
          height="16"
          rx="2"
        ></rect>

        <path d="M8 8h8"></path>

        <path d="M8 12h8"></path>

        <path d="M8 16h5"></path>

      </svg>

    </span>

    <span>
      Academic Management
    </span>

  </button>


  <button
    class="sidebar-item"
    onclick="goPage('../admin/system-reports.html')"
  >

    <span class="sidebar-icon">

      <svg viewBox="0 0 24 24">

        <path d="M5 3h14v18H5z"></path>

        <path d="M8 7h8"></path>

        <path d="M8 11h8"></path>

        <path d="M8 15h5"></path>

      </svg>

    </span>

    <span>
      System Reports
    </span>

  </button>


  <div class="sidebar-credit">

    ©SpecAdvisor 2026

  </div>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="main">


<!-- =========================================================
     TOPBAR
========================================================= -->

<div class="topbar">

  <button
    class="menu-btn"
    onclick="toggleSidebar()"
  >

    ☰

  </button>


  <span class="title">

    Monitoring Activities

  </span>


  <div class="profile-wrapper">

    <button
      class="profile-btn"
      onclick="toggleProfileMenu()"
      title="Account"
    >

      <svg viewBox="0 0 24 24">

        <circle
          cx="12"
          cy="8"
          r="4"
        ></circle>

        <path
          d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
        ></path>

      </svg>

    </button>


    <div
      class="profile-menu"
      id="profile-menu"
    >

      <button
        type="button"
        onclick="openProfile()"
      >

        <svg viewBox="0 0 24 24">

          <circle
            cx="12"
            cy="8"
            r="4"
          ></circle>

          <path
            d="M4 21c0-4 3.5-7 8-7s8 3 8 7"
          ></path>

        </svg>

        <span>
          Profile
        </span>

      </button>


      <button
        type="button"
        onclick="logout()"
      >

        <svg viewBox="0 0 24 24">

          <path d="M10 17l5-5-5-5"></path>

          <path d="M15 12H3"></path>

          <path d="M21 19V5a2 2 0 0 0-2-2h-5"></path>

        </svg>

        <span>
          Log out
        </span>

      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     CONTENT
========================================================= -->

<div class="content">


<!-- =========================================================
     SYSTEM STATS
========================================================= -->

<div class="cards">


<div class="card">

  Total Logins

  <br>
  <br>

  <b id="totalLogins">
    0
  </b>

</div>


<div class="card">

  Total Users

  <br>
  <br>

  <b id="activeUsers">
    0
  </b>

</div>


<div class="card">

  Failed Login Attempt

  <br>
  <br>

  <b id="failedLogins">
    0
  </b>

</div>


<div class="card">

  Cheating Alerts

  <br>
  <br>

  <b id="cheatingAlerts">
    0
  </b>

</div>


</div>


<br>


<h3>
Activity Log
</h3>


<!-- =========================================================
     FILTERS
========================================================= -->

<div class="activity-filters">

  <label>
    Date
  </label>

  <input
    type="date"
    id="filterDate"
    onchange="applyFilters()"
  >


  <select
    id="filterYear"
    onchange="applyFilters()"
  >

    <option value="">
      All Academic Years
    </option>

  </select>


  <label>
    Time
  </label>

  <input
    type="time"
    id="filterTime"
    onchange="applyFilters()"
  >


  <button
    class="filter-btn"
    type="button"
    onclick="loadMonitoring()"
  >

    Refresh Activity Logs

  </button>


  <button
    class="filter-btn"
    type="button"
    onclick="clearFilters()"
  >

    Clear Filters

  </button>

</div>


<!-- =========================================================
     ACTIVITY TABLE
========================================================= -->

<div class="grades-table">

  <div class="table-responsive">

    <table>

      <thead>

        <tr>

          <th>
            Date & Time
          </th>

          <th>
            User
          </th>

          <th>
            Role
          </th>

          <th>
            Action
          </th>

          <th>
            Status
          </th>

        </tr>

      </thead>


      <tbody id="activityTable">

        <tr class="no-data">

          <td colspan="5">

            No system activity yet

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


</div>

</div>

</div>


<!-- =========================================================
     ADMIN PROFILE MODAL
========================================================= -->

<div
  class="profile-overlay"
  id="profile-overlay"
  onclick="closeProfileOutside(event)"
>

  <div
    class="profile-modal"
    onclick="event.stopPropagation()"
  >

    <div class="profile-header">

      <h2>
        My Profile
      </h2>

      <button
        class="close-profile"
        type="button"
        onclick="closeProfile()"
      >

        ×

      </button>

    </div>


    <div
      class="profile-avatar"
      id="profile-avatar"
    >

      A

    </div>


    <div class="profile-info">


      <div class="profile-field">

        <label>
          Name
        </label>

        <input
          type="text"
          id="profile-fullname"
          value="ADMIN"
          disabled
        >

      </div>


      <div class="profile-field">

        <label>
          Email
        </label>

        <input
          type="email"
          id="profile-email"
          disabled
        >

      </div>


      <div class="profile-field">

        <label>
          Role
        </label>

        <input
          type="text"
          id="profile-role"
          value="ADMIN"
          disabled
        >

      </div>


    </div>


    <div
      class="profile-message"
      id="profile-message"
    ></div>


    <div class="profile-actions">

      <button
        class="edit-profile-btn"
        id="edit-profile-btn"
        type="button"
        onclick="enableProfileEdit()"
      >

        Edit Profile

      </button>


      <button
        class="cancel-profile-btn"
        id="cancel-profile-btn"
        type="button"
        onclick="cancelProfileEdit()"
      >

        Cancel

      </button>


      <button
        class="save-profile-btn"
        id="save-profile-btn"
        type="button"
        onclick="saveProfile()"
      >

        Save Changes

      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     ONE LOGOUT MODAL ONLY
========================================================= -->
<div
    id="logout-overlay"
    class="logout-overlay"
    onclick="closeLogoutOutside(event)"
>

    <div class="logout-modal-box">

        <button
            type="button"
            class="logout-close-btn"
            onclick="closeLogoutModal()"
        >
            ×
        </button>

        <h2>Log Out?</h2>

        <p>Are you sure you want to log out?</p>

        <div class="logout-actions">

            <button
                type="button"
                class="logout-cancel-btn"
                onclick="closeLogoutModal()"
            >
                Cancel
            </button>

            <button
                type="button"
                class="logout-confirm-btn"
                onclick="performLogout()"
            >
                Log Out
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     SCRIPTS
========================================================= -->

<script
  type="module"
  src="../js/monitoring.js"
></script>


<script
  type="module"
  src="../js/admin-profile.js"
></script>


<script
  src="../js/script.js"
></script>


</body>

</html>
