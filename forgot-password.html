<!DOCTYPE html>
<html>

<head>

<title>Forgot Password | SpecAdvisor</title>

<link
    rel="icon"
    type="image/png"
    href="./images/SpecAdvisor-logofavicon.png?v=2"
>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="stylesheet"
    href="./css/auth.css"
>

</head>


<body class="forgot-page">


<!-- LEFT -->

<div class="left">

    <h2 id="forgotTitle">
        Forgot Password
    </h2>

    <p
        class="forgot-subtitle"
        id="forgotSubtitle"
    >
        Enter your registered email address to reset your password.
    </p>


    <div class="forgot-form">


        <input
            type="email"
            id="resetEmail"
            placeholder="Email Address"
            autocomplete="email"
        >


        <button
            type="button"
            id="resetButton"
            onclick="sendResetEmail()"
        >
            Send Reset Link
        </button>


        <p
            class="forgot-message"
            id="forgotMessage"
        ></p>


        <p
            class="back-login"
            id="backLogin"
            onclick="goBackLogin()"
        >
            ← Back to Login
        </p>


    </div>

</div>



<!-- RIGHT -->

<div class="right">

    <img
        src="./images/SpecAdvisor-Logo.png"
        alt="SpecAdvisor Logo"
    >

</div>



<script
    type="module"
    src="./js/forgot-password.js"
></script>


</body>

</html>
